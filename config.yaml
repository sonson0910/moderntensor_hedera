# ─────────────────────────────────────────────────────────────
# ModernTensor Configuration
# Copy and edit for your specific deployment
# ─────────────────────────────────────────────────────────────

network:
  network_type: testnet           # mainnet | testnet | local
  operator_id: "0.0.XXXXX"       # Hedera operator account ID
  operator_key: ""                # Leave empty — loaded from .env

protocol:
  protocol_fee_rate: 0.05
  min_stake_amount: 100.0
  max_miners_per_task: 5
  emission_rate: 1.0
  epoch_length: 100
  min_validators: 1

validator:
  validator_id: "0.0.9999"        # Override with your actual validator ID
  enable_poi: true
  score_threshold: 0.3
  consensus_method: "weighted_median"

miner:
  miner_id: "0.0.1001"            # Override with your actual miner ID
  stake: 500.0
  port: 8091
  subnets: [0]
  capabilities:
    - "code_review"
    - "sentiment_analysis"
    - "text_generation"

api:
  ws_port: 8765
  metrics_port: 9090
  api_port: 8000

logging:
  level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
  json_format: true
  log_file: ""                    # Empty = stdout only
